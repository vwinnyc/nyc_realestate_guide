name: Refresh building stories

# Runs on the 1st of each month, or any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 14 1 * *"   # 10:17 a.m. New York time (14:17 UTC) on the 1st
  workflow_dispatch:
    inputs:
      new:
        description: "New buildings to research"
        default: "10"
      check:
        description: "Existing stories to check for news"
        default: "10"
      lore:
        description: "Whimsy category: auto, all, oncewas, song, written, tradition, or seed (starter entries only, free)"
        default: "auto"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pool data comes straight from the city's inspection records, so it doesn't need review.
      - name: Update pools from NYC Health Department records
        continue-on-error: true
        run: python tools/refresh_pools.py

      - name: Update farmers markets from the city's list
        continue-on-error: true
        run: python tools/refresh_markets.py

      - name: Research with Parallel
        id: run
        continue-on-error: true
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: |
          python tools/refresh_stories.py \
            --new "${{ github.event.inputs.new || '10' }}" \
            --check "${{ github.event.inputs.check || '10' }}"

      # Whimsy stamps: Once was, Song lines, Written here, Odd bylaws & traditions.
      # Does one category a month (rotating). Run it by hand with "all" to do every category at once.
      - name: Find whimsy stamps with Parallel
        id: lore
        continue-on-error: true
        env:
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: python tools/find_lore.py --category "${{ github.event.inputs.lore || 'auto' }}"

      # New facts go to a pull request for you to review. Merging it publishes them.
      - name: Open a pull request for review
        if: steps.run.outputs.changes > 0 || steps.lore.outputs.changes > 0
        uses: peter-evans/create-pull-request@v7
        with:
          branch: story-refresh
          add-paths: building-stories/
          commit-message: "Story refresh: new facts for review"
          title: "New building stories to review"
          body-path: story-review.md
          delete-branch: true

      # Nothing new: just save which buildings were checked, so next month moves on.
      - name: Save progress
        if: ${{ !(steps.run.outputs.changes > 0 || steps.lore.outputs.changes > 0) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add building-stories/
          git diff --cached --quiet || (git commit -m "Monthly refresh: record checked buildings, pools and markets" && git push)
