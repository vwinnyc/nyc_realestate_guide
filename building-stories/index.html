<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every building in Manhattan as an ink dot, with fun facts and stories.">
<title>Manhattan Building Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed ink-dot map of every Manhattan lot, turned 29° so the grid runs true;
   a quiet control panel floats top-left, the building card docks right (bottom sheet on phones). */
:root{
  --paper:#e9e8e2; --panel:#f5f4f0; --ink:#23241f; --ink-soft:#5e5f57; --ink-faint:#a3a298; --line:#d3d1c8;
  --e0:#2d4867; --e1:#62774a; --e2:#94683b; --e3:#6e6c7d; --e4:#b58a2a; --unk:#b9b7ad;
  --shu:#b3392a; --shu-ink:#fdf7f3; --ring:#23241f;
  --water:#cfd8d8; --land:#f1f0eb; --land-far:#e3e3dc; --park:#d3dcc3; --street:#dddbd2; --street-major:#cfccc1; --water-ink:#6f8589;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(35,36,31,.08),0 8px 28px rgba(35,36,31,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171816; --panel:#20211e; --ink:#ecebe4; --ink-soft:#a9a89f; --ink-faint:#5f5e57; --line:#34352f;
  --e0:#7f9fc6; --e1:#9bb07d; --e2:#cf9a63; --e3:#a3a1b6; --e4:#e0bb5c; --unk:#4a4a44;
  --shu:#d9533f; --shu-ink:#1b0f0c; --ring:#ecebe4; --water:#0f1415; --land:#1d1e1b; --land-far:#181917; --park:#232b1f; --street:#2b2c28; --street-major:#383934; --water-ink:#5c7479; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171816; --panel:#20211e; --ink:#ecebe4; --ink-soft:#a9a89f; --ink-faint:#5f5e57; --line:#34352f;
  --e0:#7f9fc6; --e1:#9bb07d; --e2:#cf9a63; --e3:#a3a1b6; --e4:#e0bb5c; --unk:#4a4a44;
  --shu:#d9533f; --shu-ink:#1b0f0c; --ring:#ecebe4; --water:#0f1415; --land:#1d1e1b; --land-far:#181917; --park:#232b1f; --street:#2b2c28; --street-major:#383934; --water-ink:#5c7479; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--water);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.dragging{cursor:grabbing}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;width:min(340px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px;z-index:3}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:0;letter-spacing:.01em;text-wrap:balance}
.count{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.lede{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.5}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 10px;font-size:14px}
.search input::placeholder{color:var(--ink-faint)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  list-style:none;margin:0;padding:4px;max-height:260px;overflow:auto;z-index:5}
.results li button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.results li button:hover,.results li button.active{background:var(--paper)}
.results .meta{color:var(--ink-soft);font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.legend-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;cursor:pointer;
  font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.stamp .sw{border-radius:2px;background:var(--shu);transform:rotate(8deg)}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.panel-toggle{display:none}

.card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(380px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:4;display:flex;flex-direction:column;overflow:hidden}
.card-body{overflow:auto;padding:20px 20px 16px;display:grid;gap:16px;align-content:start;min-height:0}
.card-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center;z-index:1}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-right:36px}
.addr{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin:4px 0 0;text-wrap:balance;padding-right:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:10px 0;display:grid;gap:2px}
.stat+.stat{border-left:1px solid var(--line);padding-left:12px}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
.era-tag{display:inline-flex;align-items:center;gap:6px}
.era-tag i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.story{position:relative;border:1px solid var(--line);border-radius:8px;padding:16px 16px 14px;display:grid;gap:10px;background:var(--paper)}
.story h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:800;padding-right:40px}
.hanko{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:4px;background:var(--shu);color:var(--shu-ink);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;transform:rotate(6deg)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink-soft)}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.facts li{display:grid;grid-template-columns:14px 1fr;gap:8px;line-height:1.55}
.facts li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-faint);margin-top:.6em}
.story .facts li::before{background:var(--shu)}
.section-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 -6px}
.src{font-size:12px;color:var(--ink-soft)}
.src a{color:inherit}
.fine{font-size:11.5px;color:var(--ink-soft);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}

.tools{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;align-items:flex-end;z-index:2}
.zoom{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:38px;height:36px;border:0;background:none;cursor:pointer;font-size:18px}
.zoom button+button{border-top:1px solid var(--line)}
.compass{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px 10px 6px 6px;font-size:11px;color:var(--ink-soft);max-width:210px;line-height:1.35}
.compass svg{flex:none}
.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);z-index:1}

@media (max-width:720px){
  .panel{padding:12px;gap:10px}
  h1{font-size:19px}
  .panel .collapsible{display:none}
  .panel.open .collapsible{display:grid}
  .panel-toggle{display:inline-flex;border:1px solid var(--line);background:none;border-radius:999px;font-size:11px;padding:2px 10px;cursor:pointer}
  .card{top:auto;left:0;right:0;bottom:0;width:auto;max-height:58%;border-radius:14px 14px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .card-body{padding:18px 16px 16px}
  .addr{font-size:22px}
  .tools{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  body.card-open .tools{display:none}
  .compass{max-width:150px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .25s ease}}
</style>
</head>
<body>


<canvas id="map" aria-label="Map of every Manhattan building, colored by the decade it was built"></canvas>
<div class="loading" id="loading">Plotting Manhattan’s buildings…</div>

<section class="panel" id="panel">
  <div class="brand">
    <h1>Manhattan Building Stories</h1>
    <button class="panel-toggle" id="panelToggle" aria-expanded="false" aria-controls="panelMore">Filters</button>
  </div>
  <p class="lede collapsible" id="panelMore">Every lot in Manhattan, one dot each. Tap any building for its fun facts. Red stamps mark buildings with a story.</p>
  <div class="search">
    <label for="q" class="legend-label" style="position:absolute;left:-9999px">Find a building</label>
    <input id="q" type="search" placeholder="Find an address or landmark" autocomplete="off" spellcheck="false">
    <ul class="results" id="results" hidden></ul>
  </div>
  <div class="collapsible" style="gap:8px">
    <div class="legend-label">Built</div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="count collapsible" id="count"></div>
</section>

<div class="tools">
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Show all of Manhattan" style="font-size:12px">⤢</button></div>
  <div class="compass" title="The map is rotated so Manhattan's street grid runs straight up and down">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-opacity=".35"/>
      <g transform="rotate(-29 14 14)"><path d="M14 4 L17 15 L14 13.5 L11 15 Z" fill="var(--shu)"/><path d="M14 24 L17 15 L14 16.5 L11 15 Z" fill="currentColor" fill-opacity=".45"/></g></svg>
    <span>True north is tilted. The map is turned 29° so the grid runs straight.</span>
  </div>
</div>

<aside class="card" id="card" hidden aria-live="polite">
  <button class="card-close" id="cardClose" aria-label="Close">×</button>
  <div class="card-body" id="cardBody"></div>
</aside>

<script>
(() => {
const ROT = 29 * Math.PI / 180, COS = Math.cos(ROT), SIN = Math.sin(ROT);
const THIS_YEAR = 2026;
const ERAS = [
  {key:"e0", label:"Before 1900", test:y=>y>0&&y<1900},
  {key:"e1", label:"1900–39", test:y=>y>=1900&&y<1940},
  {key:"e2", label:"1940–79", test:y=>y>=1940&&y<1980},
  {key:"e3", label:"1980–2009", test:y=>y>=1980&&y<2010},
  {key:"e4", label:"2010+", test:y=>y>=2010},
  {key:"unk", label:"Unknown", test:y=>!y},
];
const eraOf = y => ERAS.findIndex(e => e.test(y));
const show = ERAS.map(()=>true); let showStories = true;

const CLASS = {A:"One-family home",B:"Two-family home",C:"Walk-up apartments",D:"Elevator apartments",E:"Warehouse",F:"Factory",G:"Garage",H:"Hotel",I:"Health facility",J:"Theater",K:"Store",L:"Loft",M:"Religious building",N:"Care home",O:"Office building",P:"Place of assembly",Q:"Park or recreation",R:"Condominium",S:"Mixed residential",T:"Transportation",U:"Utility",V:"Vacant lot",W:"School",Y:"Government",Z:"Miscellaneous"};
const MILESTONES = [[1776,"the Declaration of Independence"],[1811,"the Manhattan street grid plan"],[1858,"Central Park"],[1883,"the Brooklyn Bridge"],[1886,"the Statue of Liberty"],[1902,"the Flatiron Building"],[1904,"the first subway line"],[1913,"Grand Central Terminal"],[1931,"the Empire State Building"],[1952,"the United Nations headquarters"],[1959,"the Guggenheim Museum"],[1973,"the original Twin Towers"],[1989,"Seinfeld"],[2007,"the iPhone"],[2009,"the High Line"],[2014,"One World Trade Center"]];
// [name, first year in office]; a person counts once
const PRES = [["Washington",1789],["J. Adams",1797],["Jefferson",1801],["Madison",1809],["Monroe",1817],["J.Q. Adams",1825],["Jackson",1829],["Van Buren",1837],["W.H. Harrison",1841],["Tyler",1841],["Polk",1845],["Taylor",1849],["Fillmore",1850],["Pierce",1853],["Buchanan",1857],["Lincoln",1861],["A. Johnson",1865],["Grant",1869],["Hayes",1877],["Garfield",1881],["Arthur",1881],["Cleveland",1885],["B. Harrison",1889],["Cleveland",1893],["McKinley",1897],["T. Roosevelt",1901],["Taft",1909],["Wilson",1913],["Harding",1921],["Coolidge",1923],["Hoover",1929],["F.D. Roosevelt",1933],["Truman",1945],["Eisenhower",1953],["Kennedy",1961],["L.B. Johnson",1963],["Nixon",1969],["Ford",1974],["Carter",1977],["Reagan",1981],["G.H.W. Bush",1989],["Clinton",1993],["G.W. Bush",2001],["Obama",2009],["Trump",2017],["Biden",2021],["Trump",2025]];
const HOODS = [["Financial District",40.7075,-74.0095],["Tribeca",40.7185,-74.0085],["SoHo",40.7235,-74.0015],["Greenwich Village",40.7335,-74.0005],["East Village",40.7275,-73.9835],["Lower East Side",40.7165,-73.9865],["Chelsea",40.7465,-74.0015],["Gramercy",40.7375,-73.9835],["Midtown",40.7555,-73.9835],["Upper West Side",40.7875,-73.9755],["Upper East Side",40.7735,-73.9565],["Central Park",40.7825,-73.9655],["Harlem",40.8115,-73.9465],["East Harlem",40.7955,-73.9385],["Washington Heights",40.8425,-73.9395],["Inwood",40.8675,-73.9215]];

const cv = document.getElementById("map"), ctx = cv.getContext("2d");
let D=null, N=0, RX, RY, ERA, STORIES=[], storyByBbl=new Map(), grid=new Map(), GC=40;
let cam={x:0,y:0,s:0.1}, W=0,H=0,DPR=1, colors={}, sel=null, fitView=null;
let origin=null;

function readColors(){
  const cs=getComputedStyle(document.documentElement);
  for (const k of ["paper","ink","ink-soft","ink-faint","e0","e1","e2","e3","e4","unk","shu","shu-ink","ring","panel","water","land","land-far","park","street","street-major","water-ink"]) colors[k]=cs.getPropertyValue("--"+k).trim();
}
function project(lat,lng){ // lat/lng -> rotated world meters
  const x=(lng-origin[1])*origin[2], y=(lat-origin[0])*origin[3];
  return [x*COS-y*SIN, x*SIN+y*COS];
}
const toScreen=(rx,ry)=>[W/2+(rx-cam.x)*cam.s, H/2-(ry-cam.y)*cam.s];
const toWorld=(sx,sy)=>[cam.x+(sx-W/2)/cam.s, cam.y-(sy-H/2)/cam.s];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); draw();
}
let raf=0; function draw(){ if(!raf) raf=requestAnimationFrame(render); }
function render(){
  raf=0; ctx.fillStyle=colors.water; ctx.fillRect(0,0,W,H);
  if(GEO) drawBase();
  if(!D) return;
  const r = Math.max(0.7, Math.min(5.5, cam.s*7));
  const [wx0,wy1]=toWorld(-10,-10), [wx1,wy0]=toWorld(W+10,H+10);
  const keys=["e0","e1","e2","e3","e4","unk"];
  for(let e=5;e>=0;e--){
    if(!show[e]) continue;
    ctx.fillStyle=colors[keys[e]]; ctx.beginPath();
    const round=r>=2.2;
    for(let i=0;i<N;i++){
      if(ERA[i]!==e) continue;
      const rx=RX[i], ry=RY[i]; if(rx<wx0||rx>wx1||ry<wy0||ry>wy1) continue;
      const sx=W/2+(rx-cam.x)*cam.s, sy=H/2-(ry-cam.y)*cam.s;
      if(round){ ctx.moveTo(sx+r,sy); ctx.arc(sx,sy,r,0,6.2832); } else ctx.rect(sx-r,sy-r,r*2,r*2);
    }
    ctx.fill();
  }
  if(GEO) drawLabels(r);
  // neighborhood labels
  const fs = Math.max(10, Math.min(15, 9+cam.s*20));
  if(cam.s<0.9){
    ctx.font=`600 ${fs}px ${getComputedStyle(document.body).getPropertyValue("--f-display")||"serif"}`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const [n,la,ln] of HOODS){
      const [rx,ry]=project(la,ln), [sx,sy]=toScreen(rx,ry);
      if(sx<-80||sx>W+80||sy<-20||sy>H+20) continue;
      ctx.lineWidth=4; ctx.strokeStyle=colors.land; ctx.globalAlpha=.85; ctx.strokeText(n.toUpperCase().split("").join(" "),sx,sy);
      ctx.globalAlpha=1; ctx.fillStyle=colors["ink-soft"]; ctx.fillText(n.toUpperCase().split("").join(" "),sx,sy);
    }
  }
  // story stamps
  if(showStories){
    const s=Math.max(7, Math.min(13, 6+cam.s*6));
    for(const st of STORIES){
      const [sx,sy]=toScreen(st.rx,st.ry); if(sx<-20||sx>W+20||sy<-20||sy>H+20) continue;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(0.1);
      ctx.fillStyle=colors.shu; roundRect(-s/2,-s/2,s,s,s*.18); ctx.fill();
      ctx.fillStyle=colors["shu-ink"]; ctx.beginPath(); ctx.arc(0,0,s*.16,0,6.2832); ctx.fill(); ctx.restore();
    }
  }
  if(sel){
    const [sx,sy]=toScreen(sel.rx,sel.ry);
    ctx.strokeStyle=colors.ring; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy,Math.max(10,r+7),0,6.2832); ctx.stroke();
    ctx.strokeStyle=colors.paper; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(sx,sy,Math.max(10,r+7)+2,0,6.2832); ctx.stroke();
  }
}

// ---------- base map ----------
let GEO=null;
const WATER_LABELS=[["Hudson River",40.7760,-74.0060],["East River",40.7550,-73.9605],["Harlem River",40.8350,-73.9310],["Upper New York Bay",40.6905,-74.0300],["New Jersey",40.7700,-74.0290],["Queens",40.7540,-73.9350],["Brooklyn",40.6950,-73.9790],["The Bronx",40.8520,-73.9120]];
function rotArr(a){const o=new Float32Array(a.length);for(let k=0;k<a.length;k+=2){const x=a[k],y=a[k+1];o[k]=x*COS-y*SIN;o[k+1]=x*SIN+y*COS;}return o;}
function prepGeo(g){
  const rings=a=>a.map(rotArr);
  GEO={land:rings(g.land),njland:rings(g.njland),parks:rings(g.parks),
    small:[],streets:g.streets.map(([c,a])=>({c,p:rotArr(a)})),labels:[]};
  for(let k=0;k<g.smallparks.length;k+=3){const x=g.smallparks[k],y=g.smallparks[k+1];GEO.small.push([x*COS-y*SIN,x*SIN+y*COS,g.smallparks[k+2]]);}
  for(const [t,x,y,a,c] of g.labels){let ang=-(a+ROT); while(ang>Math.PI/2)ang-=Math.PI; while(ang<=-Math.PI/2)ang+=Math.PI; GEO.labels.push({t,x:x*COS-y*SIN,y:x*SIN+y*COS,a:ang,c});}
  GEO.labels.sort((a,b)=>b.c-a.c);
}
function tracePoly(p){ for(let k=0;k<p.length;k+=2){const sx=W/2+(p[k]-cam.x)*cam.s, sy=H/2-(p[k+1]-cam.y)*cam.s; k?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);} ctx.closePath(); }
function traceLine(p){ for(let k=0;k<p.length;k+=2){const sx=W/2+(p[k]-cam.x)*cam.s, sy=H/2-(p[k+1]-cam.y)*cam.s; k?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);} }
function drawBase(){
  ctx.fillStyle=colors["land-far"]; ctx.beginPath(); GEO.njland.forEach(tracePoly); ctx.fill("evenodd");
  ctx.fillStyle=colors.land; ctx.beginPath(); GEO.land.forEach(tracePoly); ctx.fill("evenodd");
  ctx.fillStyle=colors.park; ctx.beginPath(); GEO.parks.forEach(tracePoly); ctx.fill("evenodd");
  // small parks and squares: soft squares the size of the lot
  ctx.beginPath();
  for(const [x,y,side] of GEO.small){ const w=side*cam.s; if(w<1.5) continue; const sx=W/2+(x-cam.x)*cam.s, sy=H/2-(y-cam.y)*cam.s;
    if(sx<-w||sx>W+w||sy<-w||sy>H+w) continue; const rr=Math.min(w*.25,6); ctx.moveTo(sx-w/2+rr,sy-w/2); ctx.arcTo(sx+w/2,sy-w/2,sx+w/2,sy+w/2,rr); ctx.arcTo(sx+w/2,sy+w/2,sx-w/2,sy+w/2,rr); ctx.arcTo(sx-w/2,sy+w/2,sx-w/2,sy-w/2,rr); ctx.arcTo(sx-w/2,sy-w/2,sx+w/2,sy-w/2,rr); ctx.closePath(); }
  ctx.fill();
  // streets
  ctx.lineCap="round"; ctx.lineJoin="round";
  const widths=[Math.min(9,cam.s*9), Math.min(12,cam.s*13), Math.min(14,Math.max(1.2,cam.s*14))];
  for(const c of [0,1,2]){
    if(c===0&&cam.s<0.12) continue; if(c===1&&cam.s<0.06) continue;
    ctx.strokeStyle=c===0?colors.street:colors["street-major"]; ctx.lineWidth=Math.max(c===0?0.5:0.8,widths[c]); ctx.beginPath();
    for(const st of GEO.streets) if(st.c===c) traceLine(st.p);
    ctx.stroke();
  }
}
const measure=new Map();
function drawLabels(){
  const placed=[];
  const hit=(x,y,w,h)=>placed.some(b=>Math.abs(b.x-x)<(b.w+w)/2+6&&Math.abs(b.y-y)<(b.h+h)/2+6);
  // water and neighboring places
  if(cam.s<2.5){
    ctx.font=`italic 500 ${Math.round(Math.max(11,Math.min(15,10+cam.s*12)))}px ${getComputedStyle(document.body).getPropertyValue("--f-display")}`;
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=colors["water-ink"];
    for(const [n,la,ln] of WATER_LABELS){ const [rx,ry]=project(la,ln),[sx,sy]=toScreen(rx,ry); if(sx<-100||sx>W+100||sy<-20||sy>H+20) continue;
      const vertical=/River/.test(n); ctx.save(); ctx.translate(sx,sy); if(vertical) ctx.rotate(-Math.PI/2); ctx.fillText(n,0,0); ctx.restore(); }
  }
  if(cam.s<0.3) return;
  const fs=cam.s>1.2?12:11;
  ctx.font=`500 ${fs}px ${getComputedStyle(document.body).getPropertyValue("--f-body")}`;
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=3; ctx.strokeStyle=colors.land; ctx.fillStyle=colors["ink-soft"];
  for(const L of GEO.labels){
    if(L.c===0&&cam.s<0.7) continue;
    const sx=W/2+(L.x-cam.x)*cam.s, sy=H/2-(L.y-cam.y)*cam.s; if(sx<0||sx>W||sy<0||sy>H) continue;
    let w=measure.get(L.t+fs); if(w==null){w=ctx.measureText(L.t).width; measure.set(L.t+fs,w);}
    const bw=Math.abs(Math.cos(L.a))*w+Math.abs(Math.sin(L.a))*fs, bh=Math.abs(Math.sin(L.a))*w+Math.abs(Math.cos(L.a))*fs;
    if(hit(sx,sy,bw,bh)) continue; placed.push({x:sx,y:sy,w:bw,h:bh});
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(L.a); ctx.strokeText(L.t,0,0); ctx.fillText(L.t,0,0); ctx.restore();
  }
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- interaction ----------
const pointers=new Map(); let drag=null, pinch=null, moved=false;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
  if(pointers.size===1) drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
  else if(pointers.size===2){const p=[...pointers.values()];pinch={d:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]),s:cam.s};drag=null;}});
cv.addEventListener("pointermove",e=>{ if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    const mx=(p[0][0]+p[1][0])/2,my=(p[0][1]+p[1][1])/2; zoomAt(mx,my,pinch.s*d/pinch.d/cam.s); moved=true; return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4){moved=true;cv.classList.add("dragging");}
    cam.x=drag.cx-dx/cam.s; cam.y=drag.cy+dy/cam.s; draw();}});
function endPtr(e){ const wasTap=!moved&&pointers.size===1; pointers.delete(e.pointerId); cv.classList.remove("dragging");
  if(pointers.size<2) pinch=null; if(pointers.size===0){ if(wasTap&&e.type==="pointerup") pick(e.clientX,e.clientY); drag=null; }
  else if(pointers.size===1){const p=[...pointers.values()][0];drag={x:p[0],y:p[1],cx:cam.x,cy:cam.y};}}
cv.addEventListener("pointerup",endPtr); cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",e=>{e.preventDefault(); zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0022)));},{passive:false});
function clampS(s){return Math.max(fitView?fitView.s*0.6:0.02, Math.min(12, s));}
function zoomAt(sx,sy,f){ const [wx,wy]=toWorld(sx,sy); cam.s=clampS(cam.s*f); cam.x=wx-(sx-W/2)/cam.s; cam.y=wy+(sy-H/2)/cam.s; draw(); }
document.getElementById("zin").onclick=()=>zoomAt(W/2,H/2,1.6);
document.getElementById("zout").onclick=()=>zoomAt(W/2,H/2,1/1.6);
document.getElementById("zfit").onclick=()=>{Object.assign(cam,fitView);draw();};

let flyAnim=0;
function flyTo(rx,ry,s){
  cancelAnimationFrame(flyAnim);
  const a={...cam}, b={x:rx,y:ry,s:clampS(s)}; const t0=performance.now(), dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:650;
  // keep target clear of the card
  const off=cardOffset(); b.x+=off.dx/b.s; b.y-=off.dy/b.s;
  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const ls=Math.log(a.s)+(Math.log(b.s)-Math.log(a.s))*e; cam.s=Math.exp(ls); cam.x=a.x+(b.x-a.x)*e; cam.y=a.y+(b.y-a.y)*e; draw(); if(k<1) flyAnim=requestAnimationFrame(step);};
  flyAnim=requestAnimationFrame(step);
}
function cardOffset(){ const c=document.getElementById("card"); if(c.hidden) return {dx:0,dy:0};
  if(innerWidth<=720) return {dx:0,dy:c.offsetHeight/2}; return {dx:(c.offsetWidth+16)/2,dy:0}; }

function pick(sx,sy){
  const [wx,wy]=toWorld(sx,sy);
  if(showStories){ let best=null,bd=18; for(const st of STORIES){const [x,y]=toScreen(st.rx,st.ry);const d=Math.hypot(x-sx,y-sy); if(d<bd){bd=d;best=st;}} if(best){select({story:best,i:best.i}); return;} }
  const tol=Math.max(14/cam.s, 8); const c0=Math.floor((wx-tol)/GC),c1=Math.floor((wx+tol)/GC),r0=Math.floor((wy-tol)/GC),r1=Math.floor((wy+tol)/GC);
  let best=-1,bd=tol;
  for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){const a=grid.get(cx+","+cy); if(!a) continue;
    for(const i of a){ if(!show[ERA[i]]) continue; const d=Math.hypot(RX[i]-wx,RY[i]-wy); if(d<bd){bd=d;best=i;} }}
  if(best>=0) select({i:best, story:storyByBbl.get(D.bbl[best])}); else closeCard();
}

// ---------- facts ----------
let floorsSorted, unitsSorted, singleFamilyCount=0;
function pctBelow(sorted,v){let lo=0,hi=sorted.length;while(lo<hi){const m=(lo+hi)>>1; if(sorted[m]<v) lo=m+1; else hi=m;} return Math.floor(lo/sorted.length*100);}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function prettyAddr(a){
  if(!a) return "Unnamed lot";
  const t=a.toLowerCase().split(/\s+/);
  return t.map((w,k)=>{
    if(/^\d+$/.test(w)&&k>0&&/^(street|avenue|st|ave|place|drive)$/.test(t[k+1]||"")) return ordinal(+w);
    if(w==="1/2") return "½";
    return w.replace(/(^|[-'])\p{L}/gu,m=>m.toUpperCase());
  }).join(" ").replace(/ ½/," ½").replace(/(\d) ½/,"$1½").replace(/\bOf The\b/,"of the").replace(/\bAnd\b/,"and");
}
function presidentsSince(y){ const seen=new Set(); for(let k=0;k<PRES.length;k++){const end=k+1<PRES.length?PRES[k+1][1]:9999; if(end>y) seen.add(PRES[k][0]);} return seen.size; }
function factsFor(i,st){
  const y=(st&&st.year)||D.yr[i], fl=D.fl[i], un=D.un[i], f=D.f[i], out=[];
  if(D.lm[i]) out.push(D.lm[i]===3?"An official NYC landmark, inside and out.":D.lm[i]===2?"Its interior is an official NYC landmark.":"An official NYC landmark.");
  if(D.h[i]) out.push(`Part of the ${D.hd[D.h[i]-1].replace(/\s+--\s+/," – ")}.`);
  if(y){
    const skip=st?st.name.toLowerCase().replace(/^the /,""):""; const nxt=MILESTONES.find(m=>m[0]>=y&&!(skip&&m[1].toLowerCase().includes(skip)));
    if(!nxt) out.push(`Newer than One World Trade Center (2014).`);
    else if(nxt[0]===y) out.push(`Built the same year as ${nxt[1]} (${y}).`);
    else out.push(`Older than ${nxt[1]} (${nxt[0]}).`);
    if(y>=1861&&y<=1865) out.push("Built during the Civil War.");
    if(y>=1920&&y<=1933) out.push("Went up during Prohibition. The odds of a speakeasy in its past are not zero.");
    else if(y>=1929&&y<=1939) out.push("Built during the Great Depression.");
    if(y>=1942&&y<=1945) out.push("Built during World War II, when most construction in the city had stopped.");
    const p=presidentsSince(y); if(y<2017) out.push(`It has stood through ${p} presidents.`);
  }
  if(f&1) out.push("The oldest building on its block.");
  if(f&2) out.push("The tallest building on its block.");
  if(f&4) out.push("It has an entire city block to itself.");
  if(fl>0){ const pc=pctBelow(floorsSorted,fl); if(pc>=60) out.push(`Taller than ${pc}% of Manhattan's buildings.`); }
  if(un>0&&fl>un) out.push(`More floors than homes: ${fmtFl(fl)} floors, ${un} ${un===1?"home":"homes"}.`);
  if(D.cl[i][0]==="A") out.push(`One of only about ${singleFamilyCount.toLocaleString()} one-family houses on the island.`);
  if(un>=50){ const pc=pctBelow(unitsSorted,un); if(pc>=80) out.push(`${un.toLocaleString()} homes, more than ${pc}% of Manhattan's residential buildings.`); }
  const alt=D.alt[i]; if(alt&&y&&alt>y) out.push(`Last major renovation on record: ${alt}.`);
  return out;
}
const fmtFl=v=>Number.isInteger(v)?v:v.toFixed(1).replace(/\.0$/,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function select(o){
  const i=o.i, st=o.story; const card=document.getElementById("card"), body=document.getElementById("cardBody");
  let html="";
  if(i!=null&&i>=0){
    const y=(st&&st.year)||D.yr[i]||0, e=eraOf(y);
    const recNote=(st&&st.year&&D.yr[i]&&Math.abs(st.year-D.yr[i])>2)?` City records list ${D.yr[i]} for this lot; the story uses the documented date.`:"";
    const cls=CLASS[D.cl[i][0]]||"Building";
    html+=`<div><div class="eyebrow"><span class="era-tag" style="--c:var(--${ERAS[e].key})"><i></i>${esc(cls)} · ${D.zip[i]||""}</span></div>
      <h2 class="addr">${esc(st?st.name:prettyAddr(D.ad[i]))}</h2>${st?`<div class="src" style="margin-top:4px">${esc(prettyAddr(D.ad[i]))}</div>`:""}</div>
      <div class="stats"><div class="stat"><b>${y||"—"}</b><span>BUILT</span></div><div class="stat"><b>${D.fl[i]?fmtFl(D.fl[i]):"—"}</b><span>FLOORS</span></div><div class="stat"><b>${D.un[i].toLocaleString()}</b><span>HOMES</span></div></div>`;
    if(st) html+=storyHTML(st);
    const fs=factsFor(i,st);
    if(fs.length) html+=`<p class="section-label">${st?"By the numbers":"Fun facts"}</p><ul class="facts">${fs.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
    html+=`<p class="fine">From the city's land records (${esc(D.source)}). Construction years in city records are sometimes estimates, especially round ones like 1900 or 1920.${recNote}</p>`;
  } else if(st){
    html+=`<div><div class="eyebrow">Story</div><h2 class="addr">${esc(st.name)}</h2></div>`+storyHTML(st);
  }
  body.innerHTML=html; card.hidden=false; document.body.classList.add("card-open"); body.scrollTop=0;
  sel=st?st:{rx:RX[i],ry:RY[i]};
  flyTo(sel.rx,sel.ry,Math.max(cam.s,0.45));
}
function storyHTML(st){
  return `<div class="story"><div class="hanko" aria-hidden="true">話</div><h3>The story</h3>
    <div class="tags">${st.tags.map(t=>`<span class="tag">${esc({history:"History",film:"On screen",lore:"Lore",residents:"Famous residents"}[t]||t)}</span>`).join("")}</div>
    <ul class="facts">${st.facts.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    ${st.news&&st.news.length?`<p class="section-label" style="margin:4px 0 -4px">Recently</p><ul class="facts">${st.news.map(n=>`<li>${esc(n.text)} <a class="src" href="${esc(n.source_url)}" target="_blank" rel="noopener">${esc(srcName(n.source_url))}</a></li>`).join("")}</ul>`:""}
    <div class="src">${(st.sources&&st.sources.length>1)?"Sources: "+[...new Set(st.sources)].map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(srcName(u))}</a>`).join(", "):`Source: <a href="${esc(st.src)}" target="_blank" rel="noopener">${esc(srcName(st.src))}</a>`}</div></div>`;
}
function srcName(u){ try{ const x=new URL(u); if(/wikipedia\.org$/.test(x.hostname)) return decodeURIComponent(x.pathname.split("/").pop()).replace(/_/g," "); return x.hostname.replace(/^www\./,""); }catch(e){ return "source"; }
}
function closeCard(){ document.getElementById("card").hidden=true; document.body.classList.remove("card-open"); sel=null; draw(); }
document.getElementById("cardClose").onclick=closeCard;
addEventListener("keydown",e=>{ if(e.key==="Escape") closeCard(); });

// ---------- search ----------
const q=document.getElementById("q"), res=document.getElementById("results"); let hits=[], active=0;
q.addEventListener("input",()=>{
  const s=q.value.trim().toUpperCase().replace(/\bST\b/g,"STREET").replace(/\bAVE?\b/g,"AVENUE").replace(/(\d+)(ST|ND|RD|TH)\b/g,"$1");
  hits=[]; if(s.length<2||!D){res.hidden=true;return;}
  for(const st of STORIES) if(st.name.toUpperCase().includes(q.value.trim().toUpperCase())) hits.push({story:st,i:st.i});
  const qq=q.value.trim().toUpperCase(); hits.sort((a,b)=>(b.story.name.toUpperCase()===qq)-(a.story.name.toUpperCase()===qq)||(b.story.name.toUpperCase().startsWith(qq))-(a.story.name.toUpperCase().startsWith(qq)));
  for(let i=0;i<N&&hits.length<10;i++) if(D.ad[i].startsWith(s)||(s.length>4&&D.ad[i].includes(s))) hits.push({i,story:storyByBbl.get(D.bbl[i])});
  active=0; renderHits();
});
q.addEventListener("keydown",e=>{ if(res.hidden) return;
  if(e.key==="ArrowDown"){active=Math.min(hits.length-1,active+1);renderHits();e.preventDefault();}
  else if(e.key==="ArrowUp"){active=Math.max(0,active-1);renderHits();e.preventDefault();}
  else if(e.key==="Enter"&&hits[active]){choose(hits[active]);}});
function renderHits(){
  if(!hits.length){res.innerHTML=`<li style="padding:8px;color:var(--ink-soft);font-size:13px">No match. Try a house number and street, like “171 5 Avenue”.</li>`;res.hidden=false;return;}
  res.innerHTML=hits.map((h,k)=>`<li><button type="button" data-k="${k}" class="${k===active?"active":""}"><span>${esc(h.story?h.story.name:prettyAddr(D.ad[h.i]))}</span><span class="meta">${h.i>=0&&h.i!=null?(D.yr[h.i]||""):""}</span></button></li>`).join("");
  res.hidden=false; res.querySelectorAll("button").forEach(b=>b.onclick=()=>choose(hits[+b.dataset.k]));
}
function choose(h){ res.hidden=true; q.blur(); select(h); }
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) res.hidden=true; });

// ---------- legend ----------
function buildChips(counts){
  const c=document.getElementById("chips");
  c.innerHTML=ERAS.map((e,k)=>`<button class="chip" type="button" aria-pressed="true" data-k="${k}" style="--c:var(--${e.key})"><span class="sw"></span>${e.label}</button>`).join("")
    +`<button class="chip stamp" type="button" aria-pressed="true" data-k="s" style="--c:var(--shu)"><span class="sw"></span>Stories</button>`;
  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ const on=b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed",on);
    if(b.dataset.k==="s") showStories=on; else show[+b.dataset.k]=on; draw(); });
}
const pt=document.getElementById("panelToggle");
pt.onclick=()=>{const p=document.getElementById("panel"); const o=!p.classList.contains("open"); p.classList.toggle("open",o); pt.setAttribute("aria-expanded",o); pt.textContent=o?"Close":"Filters";};

// ---------- theme ----------
const mq=matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener?.("change",()=>{readColors();draw();});
new MutationObserver(()=>{readColors();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
readColors();
addEventListener("resize",resize);

// ---------- load ----------
fetch("geo.json").then(r=>r.json()).then(g=>{prepGeo(g);draw();}).catch(e=>console.warn("Base map didn't load",e));
Promise.all([fetch("buildings.json").then(r=>r.json()), fetch("stories.json").then(r=>r.json())]).then(([d,stories])=>{
  D=d; N=d.x.length; origin=d.origin; RX=new Float32Array(N); RY=new Float32Array(N); ERA=new Uint8Array(N);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; const idxByBbl=new Map();
  for(let i=0;i<N;i++){ const x=d.x[i],y=d.y[i]; const rx=x*COS-y*SIN, ry=x*SIN+y*COS; RX[i]=rx; RY[i]=ry; ERA[i]=eraOf(d.yr[i]);
    x0=Math.min(x0,rx);x1=Math.max(x1,rx);y0=Math.min(y0,ry);y1=Math.max(y1,ry);
    const k=Math.floor(rx/GC)+","+Math.floor(ry/GC); let a=grid.get(k); if(!a) grid.set(k,a=[]); a.push(i); idxByBbl.set(d.bbl[i],i);
    if(d.cl[i][0]==="A") singleFamilyCount++; }
  floorsSorted=Float32Array.from(d.fl.filter(v=>v>0)).sort(); unitsSorted=Int32Array.from(d.un.filter(v=>v>0)).sort();
  for(const st of stories){
    if(st.bbl!=null){ const i=idxByBbl.get(st.bbl); if(i==null) continue; st.i=i; st.rx=RX[i]; st.ry=RY[i]; storyByBbl.set(st.bbl,st); }
    else { const [rx,ry]=project(st.lat,st.lng); st.rx=rx; st.ry=ry; st.i=null; }
    STORIES.push(st);
  }
  const counts=ERAS.map((_,k)=>0); for(let i=0;i<N;i++) counts[ERA[i]]++;
  buildChips(counts);
  document.getElementById("count").textContent=`${N.toLocaleString()} buildings · ${STORIES.length} stories · ${d.source}`;
  resize();
  const s=Math.min(W/(x1-x0), H/(y1-y0))*0.92; fitView={x:(x0+x1)/2,y:(y0+y1)/2,s};
  if(W>720) fitView.x -= 60/s; // leave room for the panel
  Object.assign(cam,fitView);
  document.getElementById("loading").remove(); draw();
  const start=STORIES.find(s=>s.name==="Flatiron Building"); if(start) select({story:start,i:start.i});
}).catch(err=>{ document.getElementById("loading").textContent="The building data didn't load. Refresh the page to try again."; console.error(err); });
})();
</script>
